[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "spokenbase-worker"
version = "0.0.0"
description = "Redpanda-fed local processing worker for Spokenbase Community"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
  "confluent-kafka>=2.15,<3",
  "fastapi>=0.140,<0.141",
  "httpx>=0.28,<1",
  "pydantic>=2.13,<3",
  "uvicorn[standard]>=0.51,<0.52"
]

[project.optional-dependencies]
test = [
  "jsonschema>=4.26,<5",
  "pytest>=9,<10",
  "ruff>=0.15,<1"
]

[project.scripts]
spokenbase-worker = "spokenbase_worker.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]

[tool.ruff]
target-version = "py312"
line-length = 100
