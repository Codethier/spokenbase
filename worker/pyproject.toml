[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "spokenbase-worker"
version = "0.0.0"
description = "Pull-based local processing worker for Spokenbase Community"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3"
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "ruff>=0.11,<1"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
