name: spokenbase-community

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:${REDPANDA_VERSION:-v26.1.14}
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
      - --mode=dev-container
      - --smp=1
      - --default-log-level=info
    ports:
      - "127.0.0.1:19092:19092"
      - "127.0.0.1:19644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    mem_limit: ${REDPANDA_MEMORY_LIMIT:-2g}
    healthcheck:
      test:
        - CMD
        - rpk
        - cluster
        - health
        - -X
        - brokers=127.0.0.1:9092
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:${REDPANDA_VERSION:-v26.1.14}
    entrypoint:
      - /bin/sh
      - /opt/spokenbase/create-redpanda-topics.sh
    environment:
      REDPANDA_BROKERS: redpanda:9092
      REDPANDA_ADMIN_HOSTS: redpanda:9644
      REDPANDA_TOPIC_PARTITIONS: ${REDPANDA_TOPIC_PARTITIONS:-6}
      REDPANDA_TOPIC_REPLICAS: ${REDPANDA_TOPIC_REPLICAS:-1}
    volumes:
      - ../scripts/create-redpanda-topics.sh:/opt/spokenbase/create-redpanda-topics.sh:ro
    depends_on:
      redpanda:
        condition: service_healthy
    restart: "no"

  worker:
    build:
      context: ../../worker
      dockerfile: Dockerfile.cpu
    environment:
      WORKER_ID: ${WORKER_ID:-spokenbase-worker-cpu}
      WORKER_QUEUE_ENABLED: ${WORKER_QUEUE_ENABLED:-true}
      WORKER_ALLOW_INSECURE_REDPANDA: ${WORKER_ALLOW_INSECURE_REDPANDA:-true}
      WORKER_HTTP_HOST: 0.0.0.0
      WORKER_HTTP_PORT: 8080
      REDPANDA_BROKERS: redpanda:9092
      REDPANDA_SECURITY_PROTOCOL: PLAINTEXT
      REDPANDA_COMMAND_TOPICS: >-
        spokenbase.media.commands.v1,
        spokenbase.transcription.commands.v1,
        spokenbase.diarization.commands.v1
      REDPANDA_EVENT_TOPIC: spokenbase.processing.events.v1
      REDPANDA_DEAD_LETTER_TOPIC: spokenbase.processing.dead-letter.v1
    ports:
      - "127.0.0.1:${WORKER_HTTP_PORT:-18080}:8080"
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
    restart: unless-stopped

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:${REDPANDA_CONSOLE_VERSION:-v3.9.0}
    profiles:
      - observability
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "127.0.0.1:18081:8080"
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redpanda-data:
